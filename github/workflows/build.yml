name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar app
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Saiyan Player" com.saiyan.player --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saiyan-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
